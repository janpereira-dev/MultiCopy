name: Publish VS Code Extension
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to VS Code Marketplace (requires VSCE token with Manage permission)'
        type: boolean
        default: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: npm run build
      - run: npx @vscode/vsce package -o multicopynator.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: multicopynator-vsix
          path: multicopynator.vsix
      - if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        run: npx @vscode/vsce publish --packagePath multicopynator.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
